name: Prettier Formatting

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Prettier
        run: npx prettier --check "**/*.{yml,yaml,json,md}"
